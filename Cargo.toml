[package]
name = "yubica"
version = "0.1.0"
edition = "2024"
description = "CLI for managing an offline root CA on a YubiKey PIV slot and signing certificates or CSRs without exposing the root private key"
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/svaroglab/tools/yubica"
readme = "README.md"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
hex = "0.4"
p256 = { version = "0.13", features = ["pkcs8", "pem"] }
p384 = { version = "0.13", features = ["pkcs8", "pem"] }
pem-rfc7468 = { version = "1.0", features = ["alloc"] }
pkcs8 = { version = "0.10", features = ["encryption", "pem"] }
rand = "0.8"
const-oid = "0.10"
signature = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
x509-cert = { version = "0.2", features = ["builder"] }
thiserror = "2"
yubikey = "0.8"

[features]
# Gates tests/hardware.rs, which talks to a real, connected YubiKey and can
# perform destructive PIV operations. Never enabled by default or in CI.
hardware-tests = []
