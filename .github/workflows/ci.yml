# Linux builds on gnu: pcsc-lite, which the yubikey crate talks to the card through, has no musl
# build. Windows talks to the card through its built-in WinSCard. A merged `chore: release vX`
# commit is tagged and released with the binary for both systems, each built on its arch's runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  rust:
    uses: SvarogLab/.github/.github/workflows/rust.yml@v1
    with:
      binaries: yubica
      linux-libc: gnu
      apt-packages: libpcsclite-dev
      windows-args: -p yubica
      windows-binaries: yubica

  tag:
    needs: rust
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: SvarogLab/.github/.github/workflows/tag-release.yml@v1
    permissions:
      contents: write

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: SvarogLab/.github/.github/workflows/release.yml@v1
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.tag }}
      download-binaries: true
      prepare: |
        cp binaries/amd64/release/yubica yubica-linux-amd64
        cp binaries/arm64/release/yubica yubica-linux-arm64
        cp binaries/windows-amd64/release/yubica.exe yubica-windows-amd64.exe
        cp binaries/windows-arm64/release/yubica.exe yubica-windows-arm64.exe
        sha256sum yubica-linux-* yubica-windows-* > SHA256SUMS
      assets: >-
        yubica-linux-amd64 yubica-linux-arm64
        yubica-windows-amd64.exe yubica-windows-arm64.exe
        SHA256SUMS
